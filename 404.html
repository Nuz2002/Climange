<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="canonical" href="/" />
    <script>
      // Save the current path and redirect to index.html
      sessionStorage.redirect = location.pathname + location.search + location.hash;
      location.replace('/');
    </script>
  </head>
  <body>
    <p>
      Redirecting... If you're not redirected, <a href="/">click here</a>.
    </p>
  </body>
</html>
